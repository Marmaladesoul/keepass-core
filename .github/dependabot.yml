# Automated dependency updates.
#
# - Grouped by ecosystem so we don't get one PR per crate on a big bump day.
# - Weekly cadence — daily is too noisy for a small team.
# - Cargo + GitHub Actions both covered.

version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait two weeks before proposing a new release: a malicious or broken
    # one is usually found and yanked within days. Security updates skip
    # the wait. See SUPPLY_CHAIN.md.
    cooldown:
      default-days: 14
    groups:
      rustcrypto:
        patterns:
          - "aes*"
          - "cbc"
          - "ctr"
          - "chacha20"
          - "salsa20"
          - "hmac"
          - "sha2"
          - "blake2"
          - "argon2"
          - "cipher"
      secret-hygiene:
        patterns:
          - "zeroize"
          - "secrecy"
          - "subtle"
      parsers:
        # Crates that parse attacker-controlled input. Bumps in this
        # group share the same "diff-against-release-notes" review
        # discipline as rustcrypto — see SUPPLY_CHAIN.md.
        patterns:
          - "quick-xml"
          - "winnow"
          - "flate2"
          - "base64"
    ignore:
      # Each of these lines' next release is a breaking change, and a
      # 0.x crate's breaking jump is a *minor* bump, which a semver-major
      # ignore would miss. Proposed weekly, they fail CI and, inside a
      # group, block the routine bumps beside them. Hold the whole line and
      # move it by hand, as a reviewed migration. cargo audit still gates
      # every pull request, so an advisory in any of them still surfaces.
      #
      # argon2 0.6 needs a newer Rust than this crate's minimum.
      - dependency-name: "argon2"
      # base64 0.23: breaking, and turns on unsafe SIMD decoders by
      # default; adopt it with that feature decision made explicitly.
      - dependency-name: "base64"
      # quick-xml 0.42: breaking reader API.
      - dependency-name: "quick-xml"
      # rand 0.10 (keepass-merge's test RNG): breaking API.
      - dependency-name: "rand"
      - dependency-name: "rand_chacha"
      # uuid past 1.23 needs a newer Rust than this crate's minimum
      # (rust-version in Cargo.toml). Release this with a minimum-Rust bump.
      - dependency-name: "uuid"
        versions: ["> 1.23"]

  # The fuzz crate is its own workspace with its own lockfile, which also
  # carries keepass-core's dependencies. Same cadence, groups and holds as
  # the root entry above (reasons there); keep the two in sync.
  - package-ecosystem: cargo
    directory: "/fuzz"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Wait two weeks before proposing a new release: a malicious or broken
    # one is usually found and yanked within days. Security updates skip
    # the wait. See SUPPLY_CHAIN.md.
    cooldown:
      default-days: 14
    groups:
      rustcrypto:
        patterns:
          - "aes*"
          - "cbc"
          - "ctr"
          - "chacha20"
          - "salsa20"
          - "hmac"
          - "sha2"
          - "blake2"
          - "argon2"
          - "cipher"
      secret-hygiene:
        patterns:
          - "zeroize"
          - "secrecy"
          - "subtle"
      parsers:
        patterns:
          - "quick-xml"
          - "winnow"
          - "flate2"
          - "base64"
    ignore:
      - dependency-name: "argon2"
      - dependency-name: "base64"
      - dependency-name: "quick-xml"
      - dependency-name: "rand"
      - dependency-name: "rand_chacha"
      - dependency-name: "uuid"
        versions: ["> 1.23"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    # Wait two weeks before proposing a new release: a malicious or broken
    # one is usually found and yanked within days. Security updates skip
    # the wait. See SUPPLY_CHAIN.md.
    cooldown:
      default-days: 14
