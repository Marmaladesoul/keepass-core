# CI for the public keepass-core workspace.
#
# Public repo → unlimited GitHub Actions minutes on all runners. We run the
# test job on a Linux/macOS/Windows matrix because this library is intended
# to work identically across all three platforms.

name: CI

on:
  pull_request:
    branches: [main]
  # Allow manual dispatch from the Actions tab.
  workflow_dispatch:

# Read-only by default: no job here writes to the repository. A job that
# needs more says so itself.
permissions:
  contents: read

# Cancel in-progress runs for the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  # Treat warnings as errors in CI even when rustc/clippy defaults wouldn't.
  RUSTFLAGS: -D warnings
  RUSTDOCFLAGS: -D warnings

jobs:
  fmt:
    name: cargo fmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: cargo clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings

  test:
    name: cargo test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo test --locked --workspace --all-features --no-fail-fast

  doc:
    name: cargo doc
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo doc --locked --workspace --no-deps --all-features

  msrv:
    # No version in the name, and no matrix (GitHub appends matrix values
    # to the name): it's a required status check, so the name must survive
    # MSRV bumps.
    name: MSRV build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          # The rust-version declared in Cargo.toml. Bump both in lockstep.
          toolchain: "1.89"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo check --locked --workspace --all-features

  audit:
    name: cargo audit
    runs-on: ubuntu-latest
    # Checks each lockfile against the RustSec Advisory Database for known
    # vulnerabilities in any transitive dependency; fails on a vulnerability
    # advisory. Unmaintained, unsound and yanked crates are warnings here and
    # are enforced by cargo deny. See SUPPLY_CHAIN.md.
    env:
      CARGO_AUDIT_VERSION: "0.23.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-audit --version "$CARGO_AUDIT_VERSION" --locked
      - name: Audit Cargo.lock
        run: cargo audit --file Cargo.lock
      # The fuzz crate is its own workspace with its own lockfile. Runs even
      # if the root audit failed, so both results show.
      - name: Audit fuzz/Cargo.lock
        if: success() || failure()
        run: cargo audit --file fuzz/Cargo.lock

  deny:
    name: cargo deny
    runs-on: ubuntu-latest
    # Stricter than cargo audit: enforces a license allowlist (no GPL
    # / unknown licenses sneaking into this MIT/Apache crate), a source
    # allowlist (deps must come from crates.io — blocks an attacker who
    # slips in a path/git override), a banned-crates list, and detects
    # duplicate-version bloat. Config lives in `deny.toml` at the
    # workspace root.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        with:
          command: check
          # `advisories` and `licenses` overlap with audit but having
          # both fail on the same advisory gives belt-and-braces. The
          # interesting additions are `bans` and `sources`.
          arguments: --all-features --locked
      # The fuzz crate is its own workspace with its own lockfile; the
      # same deny.toml applies. Runs even if the root check failed.
      - uses: EmbarkStudios/cargo-deny-action@81891abc19297b21343b15ef67dc61e4aea74fda # v2.1.4
        if: success() || failure()
        with:
          command: check
          manifest-path: ./fuzz/Cargo.toml
          arguments: --all-features --locked

  vet:
    name: cargo vet
    runs-on: ubuntu-latest
    # Every crate version in Cargo.lock must carry a recorded review: our
    # own (supply-chain/audits.toml), an imported one from a trusted
    # organisation's published audits (supply-chain/imports.lock), or an
    # exemption for a crate already here before vetting began
    # (supply-chain/config.toml). A new crate or version with none of those
    # fails, so no dependency change merges unreviewed. See SUPPLY_CHAIN.md.
    env:
      CARGO_VET_VERSION: "0.10.3"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo install cargo-vet --version "$CARGO_VET_VERSION" --locked
      # --locked: use the imports already recorded in imports.lock, so a
      # change in someone else's published audits can't pass or fail a
      # build without a commit here.
      - run: cargo vet --locked
      # The fuzz crate is its own workspace, vetted against its own store
      # (fuzz/supply-chain/) at safe-to-run: it is build and test only.
      # Runs even if the root check failed.
      - if: success() || failure()
        run: cargo vet --locked --manifest-path fuzz/Cargo.toml
