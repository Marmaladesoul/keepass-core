# Nightly fuzzing smoke run.
#
# cargo-fuzz requires the nightly toolchain. This workflow runs each fuzz
# target for a bounded time budget and fails the build if a new crash is
# discovered. Crashes are uploaded as artefacts for triage.
#
# Deliberately on a schedule rather than on every PR — fuzzing is expensive
# and doesn't need to gate ordinary code changes. New findings here feed
# into regression tests in tests/.

name: Fuzz

on:
  schedule:
    # Every day at 02:30 UTC (12:30 AEST). Adjust if we start seeing
    # overlap with peak runner contention.
    - cron: "30 2 * * *"
  workflow_dispatch:
    inputs:
      duration_seconds:
        description: "Seconds to run each fuzz target"
        required: false
        default: "300"

# Read-only: fuzzing reads the code and uploads crash artifacts, which go
# through the Actions artifact service, not the repository token.
permissions:
  contents: read

concurrency:
  group: fuzz-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fuzz:
    name: fuzz ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep this list in sync with fuzz/fuzz_targets/*.rs
        target:
          - header_parser
          - xml_parser
          - block_reader
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # nightly
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Install cargo-fuzz
        # Pinned and --locked, so a new release (or a new release of one of
        # its dependencies) can't slip into the job unreviewed.
        run: cargo install cargo-fuzz --version "0.13.2" --locked
      - name: Run fuzz target
        run: |
          cargo fuzz run ${{ matrix.target }} \
            -- -max_total_time=${{ github.event.inputs.duration_seconds || '300' }}
      - name: Upload crash artefacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-crashes
          path: fuzz/artifacts/${{ matrix.target }}/
          if-no-files-found: ignore
